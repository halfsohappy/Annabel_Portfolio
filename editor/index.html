---
layout: null
sitemap: false
permalink: /editor/
---
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>Page Editor – {{ site.data.settings.basic_settings.site_title }}</title>
	<link rel="shortcut icon" href="{{ site.data.settings.basic_settings.favicon_image | relative_url }}">
	{{ site.data.settings.font_settings.font_embed }}
	<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
	<link rel="stylesheet" href="{{ '/editor/editor.css' | relative_url }}?v={{ site.time | date: '%s' }}">
	{% include project-styles.html %}
</head>
<body class="ed">

	<div id="ed-app"></div>

	<script>
	// Site facts baked in at build time. The file list itself comes from the
	// repo (so new projects show up before the next build); this only adds
	// titles and thumbnails.
	window.EDITOR_SITE = {
		repo: { owner: 'halfsohappy', repo: 'Annabel_Portfolio', branch: 'main' },
		tags: [{% for tc in site.data.settings.tag_colors %}{% assign _k = tc[0] %}
			{ key: {{ _k | jsonify }}, label: {{ site.data.settings.tag_labels[_k] | default: _k | jsonify }}, color: {{ tc[1] | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
		],
		files: [{% for p in site.projects %}
			{ path: {{ p.relative_path | jsonify }}, url: {{ p.url | jsonify }}, title: {{ p.title | jsonify }}, image: {{ p.featured_image | jsonify }}, date: {{ p.date | date: '%Y-%m-%d' | jsonify }} },{% endfor %}{% for p in site.pages %}{% if p.path contains '_pages/' %}
			{ path: {{ p.path | jsonify }}, url: {{ p.url | jsonify }}, title: {{ p.title | jsonify }}, image: {{ p.featured_image | jsonify }}, date: null },{% endif %}{% endfor %}
			null
		].filter(Boolean)
	};
	</script>
	<script src="{{ '/editor/doc.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
	<script src="{{ '/editor/backends.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
	<script src="{{ '/editor/editor.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
