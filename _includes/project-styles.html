{%- comment -%}
Project-page (wider layout) styles: title badges, the bento summary boxes
and the sticky contents sidebar. Shared by _layouts/wider.html and the
page editor (editor/index.html) so the editor canvas matches the site.
{%- endcomment -%}
<style>
  .intro .badge {
    font-size: 0.95rem;
    padding: 6px 12px;
  }
  @media (min-width: 768px) {
    .intro .wrap--article { max-width: 75%; }
  }

  .bento {
    padding: 0 20px 15px;
  }
  .bento__inner {
    max-width: 75%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.5fr 0.6fr;
    grid-template-areas:
      "desc list"
      "meta list";
    gap: 12px;
  }
  .bento__box {
    background: transparent;
    border: 4px solid var(--pretty-pink);
    border-radius: 14px;
    padding: 18px 22px;
    min-height: 110px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    position: relative;
    overflow: hidden;
  }
  .bento__box::before { display: none; }

  /* Grid placement */
  .bento__box--desc {
    grid-area: desc;
    border: 4px solid transparent;
    background:
      linear-gradient(var(--background-color), var(--background-color)) padding-box,
      var(--tag-border-grad, var(--pretty-pink)) border-box;
  }
  .bento__box--list { grid-area: list; }
  .bento__box--meta {
    grid-area: meta;
    min-height: 0;
    padding: 12px 22px;
    border-style: dashed;
  }
  .bento__box--list {
    border-color: var(--year-accent);
  }
  .bento__box--tags {
    grid-area: tags;
    min-height: 0;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: none;
    border: none;
    box-shadow: none;
    border-radius: 0;
  }
  .bento__box--tags .badge {
    font-size: 1.1rem;
    padding: 6px 14px;
  }
  /* Horizontal layout for meta bar */
  .bento__box--meta .bento__meta {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
  }
  .bento__box--meta .bento__meta-row {
    flex-direction: row;
    align-items: baseline;
    gap: 5px;
  }

  @media (max-width: 767px) {
    .bento__inner { grid-template-columns: 1fr; grid-template-areas: "desc" "list" "meta"; }
  }

  /* Center description box — no stripe, giant ghost quote instead */
  .bento__box--desc::before { display: none; }
  .bento__desc {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    position: relative;
  }
  .bento__desc::before { display: none; }
  .bento__desc-text {
    font-family: var(--f-title);
    font-size: 1.4rem;
    color: {{ site.data.settings.tag_colors.THE }};
    font-weight: 700;
    line-height: 1.5;
    margin: 0;
    position: relative;
    z-index: 1;
  }

  /* Right image box — no padding, image fills entirely */
  .bento__box--image { padding: 0; }
  .bento__box--image::before { display: none; }
  .bento__cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    display: block;
  }

  /* Generic box header + list */
  .bento__box-title {
    font-family: var(--f-title);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--year-accent);
    margin: 0 0 8px;
  }
  .bento__box-list {
    margin: 0;
    padding-left: 1.1em;
    color: var(--text-medium-color);
    font-family: var(--f-body);
    font-size: 0.85rem;
    line-height: 1.75;
  }
  .bento__box--list .bento__box-list {
    padding-left: 0.9em;
  }

  /* Left meta box */
  .bento__meta { display: flex; flex-direction: column; gap: 14px; }
  .bento__meta-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .bento__meta-tags .badge { font-size: 0.8rem; padding: 4px 10px; }
  .bento__meta-row { display: flex; flex-direction: column; gap: 3px; }
  .bento__meta-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-color);
    font-family: var(--f-body);
  }
  .bento__meta-value {
    font-size: 0.85rem;
    color: var(--text-dark-color);
    font-family: var(--f-body);
  }

  /* Sticky ToC sidebar */
  .toc-sidebar {
    position: fixed;
    left: 10px;
    width: 11%;
    max-height: 70vh;
    overflow-y: auto;
    border: 4px solid var(--pretty-pink);
    border-radius: 14px;
    padding: 14px 12px;
    background: transparent;
    z-index: 50;
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out, visibility 0.5s ease-in-out;
  }
  .toc-sidebar.is-visible {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  @media (max-width: 1100px) { .toc-sidebar { display: none !important; } }
  .toc-sidebar__title {
    font-family: var(--f-body);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-color);
    margin: 0 0 8px;
  }
  .toc-sidebar__list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .toc-sidebar__list li { padding: 2px 0; }
  .toc-sidebar__list a {
    color: var(--text-medium-color);
    text-decoration: none;
    font-family: var(--f-body);
    font-size: 0.72rem;
    line-height: 1.4;
    display: block;
  }
  .toc-sidebar__list a:hover { color: var(--accent-color); }
  .toc-sidebar__list .toc-h4 a { padding-left: 8px; font-size: 0.67rem; }
</style>
